services:
  bridge:
    build: .
    container_name: bcomm-whatsapp-bridge
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - STT_API_URL=http://localhost:8001/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify

networks:
  coolify:
    external: true
