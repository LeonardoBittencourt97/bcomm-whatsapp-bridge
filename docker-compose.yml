services:
  bridge:
    build: .
    container_name: bcomm-whatsapp-bridge
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify
      - bcomm

  stt:
    build: ./stt-server
    container_name: bcomm-stt
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - coolify
      - bcomm

networks:
  coolify:
    external: true
  bcomm:
    driver: bridge
