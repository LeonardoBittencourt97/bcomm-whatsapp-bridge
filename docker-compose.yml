services:
  bridge:
    build: .
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bridge.rule=Host(`wa-bot.agent-bcomm.space`)"
      - "traefik.http.routers.bridge.entrypoints=https"
      - "traefik.http.routers.bridge.tls=true"
      - "traefik.http.routers.bridge.tls.certresolver=letsencrypt"
      - "traefik.http.services.bridge.loadbalancer.server.port=8000"
      - "traefik.http.routers.bridge-https.rule=Host(`wa-bot.agent-bcomm.space`)"
      - "traefik.http.routers.bridge-https.entrypoints=http"
      - "traefik.http.routers.bridge-https.middlewares=redirect-to-https"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HERMES_CONTAINER=hermes-vtj5nm6l778wrezwf46uevmj
      - CLIENTS_DIR=/data/clients
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/hermes/.hermes:/home/hermes/.hermes
      - bridge-data:/app/data
      - /data/clients:/data/clients:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  coolify:
    external: true

volumes:
  bridge-data:
