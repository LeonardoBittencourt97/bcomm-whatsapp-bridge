# Multi-tenant client configuration
# Each client is identified by their Evolution API instance name

clients:
  # ── BCOMM (default) ──────────────────────────────────────────────
  BCOMM:
    name: "BCOMM Comunicação Inteligente"
    hermes_profile: "bcomm-atendente"
    prompt_file: "prompts/bcomm/atendimento.md"
    timezone: "America/Sao_Paulo"
    business_hours:
      start: "09:00"
      end: "18:00"
      days: [mon, tue, wed, thu, fri]
    meeting_duration: 30
    welcome_message: "Olá! Sou a Ana, da BCOMM. Como posso te ajudar?"

# Default client for unknown instances
default_client: "BCOMM"
