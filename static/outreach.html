<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCOMM - Outreach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0b0c;
            --bg-surface: #0b0e14;
            --bg-card: #13161a;
            --bg-elevated: #1a1d21;
            --border: #292d30;
            --text-primary: #ffffff;
            --text-secondary: #a1a4a5;
            --text-muted: #6e727a;
            --accent: #3b9eff;
            --success: #34c759;
            --danger: #ff453a;
            --warning: #ffd60a;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 16px 24px; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .back-btn { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: var(--text-primary); }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .page-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .page-subtitle { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input { width: 100%; padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-size: 14px; font-family: inherit; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .form-input::placeholder { color: var(--text-muted); }
        textarea.form-input { min-height: 120px; resize: vertical; }
        .btn { padding: 12px 24px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #5aadff; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-surface); border-radius: var(--radius); padding: 16px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item { background: var(--bg-surface); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .task-info { flex: 1; }
        .task-name { font-weight: 500; margin-bottom: 4px; }
        .task-detail { font-size: 13px; color: var(--text-muted); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: rgba(255, 214, 10, 0.2); color: var(--warning); }
        .status-active { background: rgba(52, 199, 89, 0.2); color: var(--success); }
        .status-completed { background: rgba(59, 157, 255, 0.2); color: var(--accent); }
        .status-failed { background: rgba(255, 69, 58, 0.2); color: var(--danger); }
        .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-size: 14px; display: none; z-index: 1000; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">B</div>
                <span>Outreach</span>
            </div>
            <a href="/dashboard" class="back-btn">← Voltar ao Dashboard</a>
        </div>
    </header>

    <main class="main">
        <h1 class="page-title">Cold Outreach</h1>
        <p class="page-subtitle">Inicie contatos com leads automaticamente</p>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-pending">0</div><div class="stat-label">Pendente</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-active">0</div><div class="stat-label">Ativo</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-completed">0</div><div class="stat-label">Concluído</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-failed">0</div><div class="stat-label">Falhou</div></div>
        </div>

        <div class="grid">
            <!-- Formulário -->
            <div class="card">
                <div class="card-title">🚀 Novo Contato</div>
                
                <div class="form-group">
                    <label class="form-label">📱 Número do WhatsApp *</label>
                    <input type="text" class="form-input" id="phone" placeholder="554197054071">
                </div>

                <div class="form-group">
                    <label class="form-label">👤 Nome do Lead</label>
                    <input type="text" class="form-input" id="name" placeholder="João da Silva">
                </div>

                <div class="form-group">
                    <label class="form-label">🏢 Empresa</label>
                    <input type="text" class="form-input" id="company" placeholder="Empresa XYZ">
                </div>

                <div class="form-group">
                    <label class="form-label">📧 Email (opcional)</label>
                    <input type="email" class="form-input" id="email" placeholder="joao@empresa.com">
                </div>

                <div class="form-group">
                    <label class="form-label">📝 Instruções para o Agente *</label>
                    <textarea class="form-input" id="instructions" placeholder="Descreva detalhadamente:
- Qual o perfil do lead
- Qual problema ele tem
- Como nosso produto resolve
- Abordagem recomendada
- Objetivo do contato"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">💬 Mensagem Inicial *</label>
                    <textarea class="form-input" id="initial-message" placeholder="Olá! Sou da BCOMM... [mensagem que será enviada]"></textarea>
                </div>

                <button class="btn btn-primary" onclick="startOutreach()" style="width: 100%;">
                    🚀 Iniciar Contato
                </button>
            </div>

            <!-- Lista de tarefas -->
            <div class="card">
                <div class="card-title">📋 Contatos em Andamento</div>
                <div id="task-list" class="task-list">
                    <div class="empty-state">Nenhum contato iniciado</div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const API = '';

        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || 'success');
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 3000);
        }

        function api(url, method) {
            return fetch(url, { method: method || 'GET' }).then(function(r) { return r.json(); });
        }

        async function startOutreach() {
            var phone = document.getElementById('phone').value;
            var name = document.getElementById('name').value;
            var company = document.getElementById('company').value;
            var email = document.getElementById('email').value;
            var instructions = document.getElementById('instructions').value;
            var initialMessage = document.getElementById('initial-message').value;

            if (!phone || !instructions || !initialMessage) {
                showToast('Preencha número, instruções e mensagem', 'error');
                return;
            }

            var data = {
                phone: phone,
                name: name,
                company: company,
                email: email,
                instructions: instructions,
                initial_message: initialMessage,
                client_id: 'BCOMM'
            };

            api('/outreach/start', 'POST').then(function(r) {
                showToast('Contato iniciado com ' + (name || phone));
                loadTasks();
                loadStats();
                clearForm();
            }).catch(function(e) {
                showToast('Erro ao iniciar contato', 'error');
            });
        }

        function clearForm() {
            document.getElementById('phone').value = '';
            document.getElementById('name').value = '';
            document.getElementById('company').value = '';
            document.getElementById('email').value = '';
            document.getElementById('instructions').value = '';
            document.getElementById('initial-message').value = '';
        }

        function loadStats() {
            api('/outreach/stats/summary').then(function(s) {
                document.getElementById('stat-total').textContent = s.total;
                document.getElementById('stat-pending').textContent = s.pending;
                document.getElementById('stat-active').textContent = s.active;
                document.getElementById('stat-completed').textContent = s.completed;
                document.getElementById('stat-failed').textContent = s.failed;
            });
        }

        function loadTasks() {
            api('/outreach/list').then(function(d) {
                var el = document.getElementById('task-list');
                if (!d.tasks || !d.tasks.length) {
                    el.innerHTML = '<div class="empty-state">Nenhum contato iniciado</div>';
                    return;
                }
                el.innerHTML = d.tasks.map(function(t) {
                    return '<div class="task-item"><div class="task-info"><div class="task-name">' + (t.contact_name || t.contact_phone) + '</div><div class="task-detail">' + t.contact_phone + ' • ' + t.status + '</div></div><span class="status-badge status-' + t.status + '">' + t.status + '</span></div>';
                }).join('');
            });
        }

        loadStats();
        loadTasks();
    </script>
</body>
</html>
