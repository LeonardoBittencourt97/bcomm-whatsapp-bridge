<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCOMM - CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0b0c;
            --bg-surface: #0b0e14;
            --bg-card: #13161a;
            --bg-elevated: #1a1d21;
            --border: #292d30;
            --border-hover: #464a4d;
            --text-primary: #ffffff;
            --text-secondary: #a1a4a5;
            --text-muted: #6e727a;
            --accent: #3b9eff;
            --accent-hover: #5aadff;
            --success: #34c759;
            --danger: #ff453a;
            --warning: #ffd60a;
            --radius: 12px;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; }
        
        /* Layout */
        .crm-container { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .filter-tabs { display: flex; gap: 4px; background: var(--bg-surface); padding: 4px; border-radius: 10px; }
        .filter-tab { flex: 1; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-muted); border: none; background: transparent; }
        .filter-tab:hover { color: var(--text-secondary); }
        .filter-tab.active { background: var(--bg-card); color: var(--text-primary); }
        
        .conversations-list { flex: 1; overflow-y: auto; padding: 12px; }
        .conversation-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 8px; border: 1px solid transparent; }
        .conversation-item:hover { background: var(--bg-surface); border-color: var(--border); }
        .conversation-item.active { background: var(--bg-elevated); border-color: var(--accent); }
        
        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0; }
        .avatar.user { background: var(--accent); }
        .avatar.agent { background: var(--success); }
        .avatar.manual { background: var(--warning); }
        .avatar.paused { background: var(--text-muted); }
        
        .conversation-info { flex: 1; min-width: 0; }
        .conversation-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conversation-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        
        .conversation-meta { text-align: right; flex-shrink: 0; }
        .conversation-time { font-size: 11px; color: var(--text-muted); }
        .unread-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; background: var(--danger); border-radius: 10px; font-size: 11px; font-weight: 600; margin-top: 4px; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.open { background: var(--success); }
        .status-dot.paused { background: var(--warning); }
        .status-dot.closed { background: var(--text-muted); }
        
        /* Main Chat Area */
        .chat-area { display: flex; flex-direction: column; background: var(--bg-primary); }
        
        .chat-header { padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; }
        .chat-header-details { }
        .chat-header-name { font-size: 16px; font-weight: 600; }
        .chat-header-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        
        .chat-actions { display: flex; gap: 8px; }
        
        /* Summary Card */
        .summary-card { padding: 16px 24px; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .summary-item { text-align: center; }
        .summary-value { font-size: 20px; font-weight: 700; color: var(--accent); }
        .summary-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
        
        /* Messages */
        .messages-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        
        .message { display: flex; gap: 12px; max-width: 70%; }
        .message.user { align-self: flex-start; }
        .message.agent { align-self: flex-end; flex-direction: row-reverse; }
        .message.manual { align-self: flex-end; flex-direction: row-reverse; }
        
        .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
        
        .message-content { }
        .message-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .message.user .message-bubble { background: var(--bg-elevated); border-bottom-left-radius: 4px; }
        .message.agent .message-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.manual .message-bubble { background: var(--success); color: white; border-bottom-right-radius: 4px; }
        
        .message-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .message.user .message-time { text-align: left; }
        .message.agent .message-time, .message.manual .message-time { text-align: right; }
        
        .message.unanswered .message-bubble { border: 2px solid var(--warning); }
        .message.unanswered .message-label { font-size: 11px; color: var(--warning); margin-bottom: 4px; }
        
        .message.model { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-style: italic; }
        
        /* Input Area */
        .input-area { padding: 16px 24px; background: var(--bg-card); border-top: 1px solid var(--border); }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .message-input { flex: 1; padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; }
        .message-input:focus { outline: none; border-color: var(--accent); }
        .message-input::placeholder { color: var(--text-muted); }
        
        .btn { padding: 10px 20px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state-text { font-size: 16px; }
        
        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); font-size: 14px; display: none; z-index: 1000; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    </style>
</head>
<body>
    <div class="crm-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">💬 Atendimento</div>
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterConversations('all', this)">Todas</button>
                    <button class="filter-tab" onclick="filterConversations('open', this)">Abertas</button>
                    <button class="filter-tab" onclick="filterConversations('paused', this)">Pausadas</button>
                    <button class="filter-tab" onclick="filterConversations('closed', this)">Encerradas</button>
                </div>
            </div>
            <div class="conversations-list" id="conversations-list">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">Nenhuma conversa</div>
                </div>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chat-header" style="display: none;">
                <div class="chat-header-info">
                    <div class="avatar user" id="chat-avatar">?</div>
                    <div class="chat-header-details">
                        <div class="chat-header-name" id="chat-name">Selecione uma conversa</div>
                        <div class="chat-header-status">
                            <div class="status-dot open" id="chat-status-dot"></div>
                            <span id="chat-status-text">Online</span>
                        </div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="btn btn-warning btn-sm" id="btn-pause" onclick="pauseAgent()">⏸ Pausar Agente</button>
                    <button class="btn btn-success btn-sm" id="btn-resume" onclick="resumeAgent()" style="display: none;">▶ Retomar Agente</button>
                    <button class="btn btn-secondary btn-sm" onclick="closeConversation()">✕ Encerrar</button>
                </div>
            </div>
            
            <div class="summary-card" id="summary-card" style="display: none;">
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="summary-total">0</div>
                        <div class="summary-label">Total</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="summary-user">0</div>
                        <div class="summary-label">Do Cliente</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="summary-agent">0</div>
                        <div class="summary-label">Da IA</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="summary-unanswered" style="color: var(--warning);">0</div>
                        <div class="summary-label">Não Respondidas</div>
                    </div>
                </div>
            </div>
            
            <div class="messages-container" id="messages-container">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">Selecione uma conversa para ver as mensagens</div>
                </div>
            </div>
            
            <div class="input-area" id="input-area" style="display: none;">
                <div class="input-wrapper">
                    <textarea class="message-input" id="message-input" placeholder="Digite sua mensagem..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // ── State ──────────────────────────────────────────────────
        let currentPhone = null;
        let currentFilter = 'all';
        let conversations = [];
        
        // ── API Calls ──────────────────────────────────────────────
        async function api(url, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            
            try {
                const response = await fetch(url, options);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }
        
        // ── Load Conversations ─────────────────────────────────────
        async function loadConversations() {
            let url = '/crm/conversations?limit=100';
            if (currentFilter !== 'all') url += `&status=${currentFilter}`;
            
            const data = await api(url);
            if (!data) return;
            
            conversations = data.conversations;
            renderConversations();
        }
        
        function renderConversations() {
            const container = document.getElementById('conversations-list');
            
            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">Nenhuma conversa encontrada</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${currentPhone === conv.phone ? 'active' : ''}" 
                     onclick="selectConversation('${conv.phone}')">
                    <div class="avatar ${conv.agent_enabled ? 'user' : 'paused'}">
                        ${conv.phone ? conv.phone.slice(-2) : '?'}
                    </div>
                    <div class="conversation-info">
                        <div class="conversation-name">${conv.phone}</div>
                        <div class="conversation-preview">${conv.last_message || 'Sem mensagens'}</div>
                    </div>
                    <div class="conversation-meta">
                        <div class="conversation-time">${formatTime(conv.last_message_time)}</div>
                        ${conv.unanswered_count > 0 ? `<div class="unread-badge">${conv.unanswered_count}</div>` : ''}
                    </div>
                    <div class="status-dot ${conv.status}"></div>
                </div>
            `).join('');
        }
        
        // ── Select Conversation ────────────────────────────────────
        async function selectConversation(phone) {
            currentPhone = phone;
            
            // Update UI
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('summary-card').style.display = 'block';
            document.getElementById('input-area').style.display = 'block';
            
            // Load conversation data
            const conv = await api(`/crm/conversations/${phone}`);
            if (!conv) return;
            
            // Update header
            document.getElementById('chat-name').textContent = phone;
            document.getElementById('chat-avatar').textContent = phone.slice(-2);
            
            const statusDot = document.getElementById('chat-status-dot');
            const statusText = document.getElementById('chat-status-text');
            const btnPause = document.getElementById('btn-pause');
            const btnResume = document.getElementById('btn-resume');
            
            statusDot.className = `status-dot ${conv.status}`;
            statusText.textContent = conv.status === 'open' ? 'Agente Ativo' : 
                                     conv.status === 'paused' ? 'Agente Pausado' : 'Encerrada';
            
            if (conv.agent_enabled) {
                btnPause.style.display = 'inline-flex';
                btnResume.style.display = 'none';
            } else {
                btnPause.style.display = 'none';
                btnResume.style.display = 'inline-flex';
            }
            
            // Load summary
            const summary = await api(`/crm/conversations/${phone}/summary`);
            if (summary) {
                document.getElementById('summary-total').textContent = summary.total_messages;
                document.getElementById('summary-user').textContent = summary.user_messages;
                document.getElementById('summary-agent').textContent = summary.agent_messages;
                document.getElementById('summary-unanswered').textContent = summary.unanswered;
            }
            
            // Load messages
            const messagesData = await api(`/crm/conversations/${phone}/messages`);
            if (messagesData) {
                renderMessages(messagesData.messages, conv.agent_enabled);
            }
            
            // Re-render conversations list
            renderConversations();
        }
        
        // ── Render Messages ────────────────────────────────────────
        function renderMessages(messages, agentEnabled) {
            const container = document.getElementById('messages-container');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">Nenhuma mensagem ainda</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = messages.map(msg => {
                const isAnswered = msg.responded !== false;
                const isUnanswered = msg.sender === 'user' && !isAnswered;
                
                return `
                    <div class="message ${msg.sender} ${isUnanswered ? 'unanswered' : ''}">
                        <div class="message-avatar ${msg.sender}">
                            ${msg.sender === 'user' ? '👤' : msg.sender === 'agent' ? '🤖' : '👨‍💼'}
                        </div>
                        <div class="message-content">
                            ${isUnanswered ? '<div class="message-label">⚠️ Não respondida</div>' : ''}
                            <div class="message-bubble">${msg.content}</div>
                            <div class="message-time">${formatTime(msg.timestamp)}</div>
                            ${msg.model ? `<div class="message/model">${msg.model}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }
        
        // ── Send Message ───────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content || !currentPhone) return;
            
            const result = await api(`/crm/conversations/${currentPhone}/send`, 'POST', { content });
            
            if (result) {
                input.value = '';
                showToast('Mensagem enviada!', 'success');
                selectConversation(currentPhone);
                loadConversations();
            }
        }
        
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // ── Agent Actions ──────────────────────────────────────────
        async function pauseAgent() {
            if (!currentPhone) return;
            
            const result = await api(`/crm/conversations/${currentPhone}/pause`, 'POST');
            if (result) {
                showToast('Agente pausado', 'success');
                selectConversation(currentPhone);
                loadConversations();
            }
        }
        
        async function resumeAgent() {
            if (!currentPhone) return;
            
            const result = await api(`/crm/conversations/${currentPhone}/resume`, 'POST');
            if (result) {
                showToast('Agente retomado', 'success');
                selectConversation(currentPhone);
                loadConversations();
            }
        }
        
        async function closeConversation() {
            if (!currentPhone) return;
            
            if (!confirm('Tem certeza que deseja encerrar esta conversa?')) return;
            
            const result = await api(`/crm/conversations/${currentPhone}/close`, 'POST');
            if (result) {
                showToast('Conversa encerrada', 'success');
                currentPhone = null;
                document.getElementById('chat-header').style.display = 'none';
                document.getElementById('summary-card').style.display = 'none';
                document.getElementById('input-area').style.display = 'none';
                document.getElementById('messages-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">Selecione uma conversa para ver as mensagens</div>
                    </div>
                `;
                loadConversations();
            }
        }
        
        // ── Filters ────────────────────────────────────────────────
        function filterConversations(filter, el) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
            
            loadConversations();
        }
        
        // ── Helpers ────────────────────────────────────────────────
        function formatTime(timestamp) {
            if (!timestamp) return '';
            
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Agora';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}min`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h`;
            
            return date.toLocaleDateString('pt-BR');
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        // ── Auto-refresh ───────────────────────────────────────────
        setInterval(() => {
            loadConversations();
            if (currentPhone) selectConversation(currentPhone);
        }, 10000);
        
        // ── Init ───────────────────────────────────────────────────
        loadConversations();
    </script>
</body>
</html>
