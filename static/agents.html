<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCOMM - Agentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0b0c;--surface:#0b0e14;--card:#13161a;--elevated:#1a1d21;--border:#292d30;--border-hover:#464a4d;--text:#fff;--text2:#a1a4a5;--muted:#6e727a;--accent:#3b9eff;--accent2:#5aadff;--green:#34c759;--red:#ff453a;--yellow:#ffd60a;--orange:#ff9500;--r:12px;--rl:16px;--menu-w:60px;--menu-expanded:220px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .app{display:flex;height:100vh}
        .sidebar{width:var(--menu-expanded);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s;overflow:hidden;z-index:50;flex-shrink:0;position:fixed;top:0;left:0;bottom:0}
        .sidebar.collapsed{width:var(--menu-w)}
        .sidebar-logo{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);gap:12px;overflow:hidden}
        .sidebar-logo .logo-icon{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
        .sidebar-logo .logo-text{font-size:14px;font-weight:600;white-space:nowrap;transition:opacity .2s}
        .sidebar.collapsed .logo-text{opacity:0}
        .nav-items{flex:1;padding:8px 0;overflow-y:auto}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;color:var(--muted);transition:all .15s;border-left:3px solid transparent;white-space:nowrap;text-decoration:none}
        .nav-item:hover{color:var(--text);background:var(--card)}
        .nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(59,158,255,.08)}
        .nav-item .icon{width:24px;text-align:center;font-size:16px;flex-shrink:0}
        .nav-item .label{font-size:13px;font-weight:500;transition:opacity .2s}
        .sidebar.collapsed .nav-item .label{opacity:0}
        .nav-divider{height:1px;background:var(--border);margin:8px 16px}
        .sidebar-toggle{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;color:var(--muted);transition:all .15s;border-top:1px solid var(--border);white-space:nowrap}
        .sidebar-toggle:hover{color:var(--text);background:var(--card)}
        .sidebar-toggle .label{font-size:13px;font-weight:500}
        .sidebar.collapsed .sidebar-toggle .label{opacity:0}
        .main{margin-left:var(--menu-expanded);flex:1;display:flex;flex-direction:column;overflow:hidden;transition:margin-left .2s}
        .sidebar.collapsed~.main{margin-left:var(--menu-w)}
        .topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
        .search-trigger{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:13px;cursor:pointer;transition:all .15s;min-width:300px}
        .search-trigger:hover{border-color:var(--accent);color:var(--text2)}
        .search-trigger .shortcut{margin-left:auto;font-size:11px;background:var(--elevated);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}
        .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .org-selector{position:relative;display:flex;align-items:center}
        .org-select-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
        .org-select-btn:hover{border-color:var(--accent)}
        .org-select-btn .org-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
        .org-dropdown{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:200px;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.3)}
        .org-dropdown.show{display:block}
        .org-dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;color:var(--text2);font-size:13px;transition:background .15s}
        .org-dropdown-item:hover{background:var(--surface);color:var(--text)}
        .org-dropdown-item.active{color:var(--accent);font-weight:500}
        .org-dropdown-divider{height:1px;background:var(--border)}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;position:relative}
        .user-menu-wrap{position:relative;display:inline-block}
        .user-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:200px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .user-menu.show{display:block}
        .user-menu-header{padding:12px 16px;border-bottom:1px solid var(--border)}
        .user-menu-name{font-size:14px;font-weight:600}
        .user-menu-email{font-size:12px;color:var(--muted)}
        .user-menu-item{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;text-decoration:none}
        .user-menu-item:hover{background:var(--surface);color:var(--text)}
        .user-menu-divider{height:1px;background:var(--border)}
        .content{flex:1;overflow-y:auto;padding:24px}

        .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .toolbar-left{display:flex;align-items:center;gap:12px;flex:1}
        .search-input{flex:1;max-width:360px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
        .search-input:focus{border-color:var(--accent)}
        .filter-select{padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;outline:none;cursor:pointer}
        .filter-select:focus{border-color:var(--accent)}
        .btn{padding:10px 20px;border:none;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
        .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
        .btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
        .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--text2)}
        .btn-secondary{background:var(--card);color:var(--text2);border:1px solid var(--border)}
        .btn-secondary:hover{background:var(--elevated);color:var(--text);border-color:var(--accent)}
        .btn-sm{padding:6px 12px;font-size:12px}

        .page-title{font-size:28px;font-weight:600;margin-bottom:8px}
        .page-subtitle{font-size:15px;color:var(--muted);margin-bottom:24px}

        .agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);display:flex;flex-direction:column;transition:all .15s}
        .card:hover{border-color:var(--border-hover)}
        .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
        .card-title{font-size:16px;font-weight:600}
        .card-body{padding:16px 20px;flex:1}
        .card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase}
        .badge-success{background:rgba(52,199,89,.15);color:var(--green)}
        .empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
        .empty-icon{font-size:48px;margin-bottom:16px}
        .empty-text{font-size:16px;margin-bottom:8px}
        .empty-sub{font-size:13px}

        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);width:560px;max-width:90vw;max-height:85vh;overflow-y:auto}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .modal-title{font-size:18px;font-weight:600}
        .modal-close{width:32px;height:32px;border:none;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);font-size:18px}
        .modal-close:hover{background:var(--surface);color:var(--text)}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
        .form-group{margin-bottom:16px}
        .form-label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
        .form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .15s}
        .form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
        .form-textarea{resize:vertical;min-height:140px;line-height:1.5}
        .checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text2);font-size:13px}

        .toast{position:fixed;bottom:24px;right:24px;padding:14px 20px;background:var(--elevated);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;display:none;z-index:300}
        .toast.success{border-color:var(--green);display:block}
        .toast.error{border-color:var(--red);display:block}
        @media(max-width:768px){.sidebar{width:0}.main{margin-left:0}.agents-grid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}}
        /* === Realtime Toast === */
        .realtime-toast{position:fixed;bottom:24px;right:24px;background:var(--elevated);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;max-width:380px;z-index:9999;animation:slideIn .3s ease;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
        .realtime-toast .icon{width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .realtime-toast .text{flex:1;font-size:13px;line-height:1.4}
        .realtime-toast .text .title{font-weight:600;color:var(--text)}
        .realtime-toast .text .sub{color:var(--muted);font-size:12px}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
    </style>
<script src="/realtime.js"></script>
<script src="/search.js"></script>
</head>
<body>
<div class="app">
    <nav class="sidebar">
        <div class="sidebar-logo">
            <a href="/dashboard" class="logo" style="text-decoration:none;color:inherit"><div class="logo-icon">B</div><span class="logo-text">BCOMM</span></a>
        </div>
        <div class="nav-items">
            <a href="/dashboard" class="nav-item" data-page="dashboard"><span class="icon">📊</span><span class="label">Dashboard</span></a>
            <a href="/crm" class="nav-item" data-page="conversations"><span class="icon">💬</span><span class="label">Atendimento</span></a>
            <a href="/contacts" class="nav-item" data-page="contacts"><span class="icon">📇</span><span class="label">Contatos</span></a>
            <a href="/organizations" class="nav-item" data-page="organizations"><span class="icon">🏢</span><span class="label">Organizações</span></a>
            <a href="/pipelines" class="nav-item" data-page="deals"><span class="icon">💰</span><span class="label">Negócios</span></a>
            <a href="/activities" class="nav-item" data-page="activities"><span class="icon">📋</span><span class="label">Atividades</span></a>
            <a href="/notes" class="nav-item" data-page="notes"><span class="icon">📝</span><span class="label">Notas</span></a>
            <a href="/agents" class="nav-item active" data-page="agents"><span class="icon">🤖</span><span class="label">Agentes</span></a>
            <div class="nav-divider"></div>
            <a href="/users" class="nav-item" data-page="users"><span class="icon">👥</span><span class="label">Usuários</span></a>
            <a href="/config" class="nav-item" data-page="settings"><span class="icon">⚙️</span><span class="label">Configurações</span></a>
        </div>
        <div class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('collapsed')"><span class="icon">☰</span><span class="label">Recolher</span></div>
    </nav>

    <div class="main">
        <div class="topbar">
            <div class="search-trigger"><span>🔍</span><span>Buscar contatos, deals, mensagens...</span><span class="shortcut">Ctrl+K</span></div>
            <div class="topbar-right">
            <div class="org-selector" id="org-selector" style="display:none">
                <button class="org-select-btn" onclick="toggleOrgDropdown()">
                    <span class="org-dot"></span>
                    <span id="org-current-name">Todas</span>
                    <span style="font-size:10px">▼</span>
                </button>
                <div class="org-dropdown" id="org-dropdown">
                    <div class="org-dropdown-item active" onclick="selectOrg(null)">Todas</div>
                </div>
            </div>
            <div class="user-menu-wrap">
                <div class="user-avatar" id="user-avatar" onclick="toggleUserMenu()">U</div>
                <div class="user-menu" id="user-menu">
                    <div class="user-menu-header"><div class="user-menu-name" id="menu-user-name">Carregando...</div><div class="user-menu-email" id="menu-user-email"></div></div>
                    <div class="user-menu-item" onclick="showChangePasswordModal()">🔑 Trocar Senha</div>
                    <div class="user-menu-divider"></div>
                    <div class="user-menu-item" onclick="logout()" style="color:var(--red)">🚪 Sair</div>
                </div>
            </div>
        </div>
        </div>

        <div class="content">
            <div class="toolbar">
                <div class="toolbar-left">
                    <h1 class="page-title" style="margin-bottom:0">Agentes</h1>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-primary" onclick="showAgentModal()">+ Novo Agente</button>
                </div>
            </div>

            <div id="agents-grid" class="agents-grid"></div>
        </div>
    </div>
</div>

<!-- Modal Criar/Editar Agente -->
<div class="modal-overlay" id="agent-modal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="agent-modal-title">Novo Agente</span>
            <button class="modal-close" onclick="hideModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="agent-id">
            <div class="form-group"><label class="form-label">Nome</label><input type="text" class="form-input" id="agent-name" placeholder="Ex: Ana - Atendimento"></div>
            <div class="form-group"><label class="form-label">Slug (identificador único)</label><input type="text" class="form-input" id="agent-slug" pattern="[a-z0-9-]+" placeholder="Ex: atendimento"></div>
            <div class="form-group"><label class="form-label">Descrição</label><input type="text" class="form-input" id="agent-description" placeholder="Breve descrição do agente"></div>
            <div class="form-group"><label class="form-label">System Prompt</label><textarea class="form-textarea" id="agent-prompt" placeholder="Instruções de comportamento, tom, regras... "></textarea></div>
            <div class="form-group"><label class="checkbox-row"><input type="checkbox" id="agent-default"> Definir como agente padrão</label></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="hideModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveAgent()">Salvar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
let agents=[];
let currentOrgId=null;
let userOrgs=[];

function showToast(m,t='success'){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+t;setTimeout(()=>{e.className='toast'},3000)}
function openModal(id){document.getElementById(id).classList.add('show')}
function hideModal(){document.getElementById('agent-modal').classList.remove('show')}

async function api(u,m='GET',b=null){
    const o={method:m,headers:{'Content-Type':'application/json'}};
    if(b)o.body=JSON.stringify(b);
    const r=await fetch(u,o);
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'Erro')}
    return await r.json();
}

async function loadAgents(){
    if(!currentOrgId)return;
    try{
        const r=await api(`/crm/organizations/${currentOrgId}/agents`);
        agents=r.agents||[];
        renderAgents();
    }catch(e){showToast('Erro ao carregar: '+e.message,'error')}
}

function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAgents(){
    const el=document.getElementById('agents-grid');
    if(!agents.length){el.innerHTML='<div class="empty"><div class="empty-icon">🤖</div><div class="empty-text">Nenhum agente configurado</div><div class="empty-sub">Clique em "+ Novo Agente" para começar</div></div>';return}
    el.innerHTML=agents.map(a=>`
        <div class="card">
            <div class="card-header">
                <span class="card-title">🤖 ${escapeHtml(a.name)}</span>
                ${a.is_default?'<span class="badge badge-success">Padrão</span>':''}
            </div>
            <div class="card-body">
                <div style="font-size:12px;color:var(--text2);margin-bottom:8px">@${escapeHtml(a.slug)}</div>
                <div style="font-size:13px;margin-bottom:8px">${a.description?escapeHtml(a.description):'<span style="color:var(--muted)">Sem descrição</span>'}</div>
            </div>
            <div class="card-footer">
                ${!a.is_default?`<button class="btn btn-secondary btn-sm" onclick="setDefaultAgent('${a.id}')">Tornar Padrão</button>`:''}
                <button class="btn btn-secondary btn-sm" onclick="editAgent('${a.id}')">Editar</button>
                <button class="btn btn-danger btn-sm" onclick="deleteAgent('${a.id}','${escapeHtml(a.name).replace(/'/g,"\\'")}')" ${agents.length<=1?'disabled title="Último agente não pode ser excluído"':''}>Excluir</button>
            </div>
        </div>
    `).join('');
}

function showAgentModal(a=null){
    document.getElementById('agent-modal-title').textContent=a?'Editar Agente':'Novo Agente';
    document.getElementById('agent-id').value=a?a.id:'';
    document.getElementById('agent-name').value=a?a.name||'':'';
    document.getElementById('agent-slug').value=a?a.slug||'':'';
    document.getElementById('agent-description').value=a?a.description||'':'';
    document.getElementById('agent-prompt').value='';
    document.getElementById('agent-default').checked=a?(a.is_default||false):false;
    if(a){loadAgentPrompt(a.id)}
    openModal('agent-modal');
}

async function loadAgentPrompt(agentId){
    try{
        const r=await api(`/crm/organizations/${currentOrgId}/agents/${agentId}`);
        document.getElementById('agent-prompt').value=r.agent?r.agent.system_prompt||'':'';
    }catch(e){showToast('Erro: '+e.message,'error')}
}

async function saveAgent(){
    const id=document.getElementById('agent-id').value;
    const data={
        name:document.getElementById('agent-name').value.trim(),
        slug:document.getElementById('agent-slug').value.trim(),
        description:document.getElementById('agent-description').value.trim(),
        system_prompt:document.getElementById('agent-prompt').value,
        is_default:document.getElementById('agent-default').checked
    };
    if(!data.name||!data.slug){showToast('Preencha nome e slug','error');return}
    if(!data.system_prompt){showToast('Preencha o system prompt','error');return}
    try{
        if(id){await api(`/crm/organizations/${currentOrgId}/agents/${id}`,'PUT',data);showToast('Agente atualizado!')}
        else{await api(`/crm/organizations/${currentOrgId}/agents`,'POST',data);showToast('Agente criado!')}
        hideModal();loadAgents();
    }catch(e){showToast('Erro: '+e.message,'error')}
}

async function deleteAgent(id,name){
    if(!confirm(`Excluir o agente "${name}"? Conversas serão transferidas ao agente padrão.`))return;
    try{
        await api(`/crm/organizations/${currentOrgId}/agents/${id}`,'DELETE');
        showToast('Agente excluído');
        loadAgents();
    }catch(e){showToast('Erro: '+e.message,'error')}
}

async function setDefaultAgent(id){
    try{
        await api(`/crm/organizations/${currentOrgId}/agents/${id}/set-default`,'POST');
        showToast('Agente padrão atualizado');
        loadAgents();
    }catch(e){showToast('Erro: '+e.message,'error')}
}

function editAgent(id){
    const a=agents.find(x=>x.id===id);if(!a)return;
    showAgentModal(a);
}

function toggleOrgDropdown(){
    const d=document.getElementById('org-dropdown');
    d.classList.toggle('show');
    const close=(e)=>{if(!d.contains(e.target)&&!e.target.closest('.org-select-btn')){d.classList.remove('show');document.removeEventListener('click',close)}};
    setTimeout(()=>document.addEventListener('click',close),0);
}

function applyTheme(theme){if(!theme)return;Object.entries(theme).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v))}
async function loadTheme(){try{const r=await api("/crm/themes/current");if(r&&r.theme)applyTheme(r.theme)}catch(e){}}

async function selectOrg(orgId){
    document.getElementById('org-dropdown').classList.remove('show');
    try{
        await fetch('/crm/auth/select-org',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id:orgId})});
    }catch(e){}
    window.location.reload();
}

function renderOrgSelector(){
    const selector=document.getElementById('org-selector');
    if(!selector)return;
    if(userOrgs.length<=1){selector.style.display='none';return}
    selector.style.display='flex';
    const dd=document.getElementById('org-dropdown');
    dd.innerHTML='<div class="org-dropdown-item '+(!currentOrgId?'active':'')+'" onclick="selectOrg(null)">Todas</div><div class="org-dropdown-divider"></div>';
    dd.innerHTML+=userOrgs.map(o=>'<div class="org-dropdown-item '+(currentOrgId===o.id?'active':'')+'" onclick="selectOrg(\''+o.id+'\')">'+(o.name||o.id)+'</div>').join('');
    document.getElementById('org-current-name').textContent=currentOrgId?(userOrgs.find(o=>o.id===currentOrgId)||{}).name||'Org':'Todas';
}

async function loadUserInfo(){
    try{
        const r=await fetch('/crm/auth/me',{headers:{'Accept':'application/json'}});
        if(r.status===401){window.location.href='/login';return}
        const data=await r.json();
        if(r.ok&&data){
            const initial=(data.user.name||data.user.email||'U')[0].toUpperCase();
            document.getElementById('user-avatar').textContent=initial;
            const nameEl=document.getElementById('menu-user-name');
            const emailEl=document.getElementById('menu-user-email');
            if(nameEl)nameEl.textContent=data.user.name||'Usuário';
            if(emailEl)emailEl.textContent=data.user.email||'';
            const role=data.user.role||'agent';
            const usersNavItem=document.querySelector('[data-page="users"]');
            const agentsNavItem=document.querySelector('[data-page="agents"]');
            if(usersNavItem&&role!=='master'&&role!=='admin_geral')usersNavItem.style.display='none';
            if(agentsNavItem&&role!=='master'&&role!=='admin_geral'&&role!=='admin_contas')agentsNavItem.style.display='none';

            userOrgs=data.organizations||[];
            const cookies=document.cookie.split(';');
            for(const c of cookies){const [n,v]=c.trim().split('=');if(n==='bcomm_org_id'){currentOrgId=decodeURIComponent(v)||null;break}}
            if(!currentOrgId&&userOrgs.length){currentOrgId=userOrgs[0].id}
            renderOrgSelector();
            loadTheme();
            loadAgents();
        }
    }catch(e){window.location.href='/login'}
}

function toggleUserMenu(){
    const m=document.getElementById('user-menu');
    m.classList.toggle('show');
    const close=(e)=>{if(!m.contains(e.target)&&e.target.id!=='user-avatar'){m.classList.remove('show');document.removeEventListener('click',close)}};
    setTimeout(()=>document.addEventListener('click',close),0);
}

function showChangePasswordModal(){
    document.getElementById('user-menu').classList.remove('show');
    const cp=prompt('Digite sua senha atual:');
    if(!cp)return;
    const pw=prompt('Digite sua nova senha (mínimo 6 caracteres):');
    if(pw&&pw.length>=6){
        fetch('/crm/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:cp,new_password:pw})})
        .then(r=>r.json()).then(d=>{if(d.status==='ok')alert('Senha alterada com sucesso!');else alert('Erro: '+d.detail)}).catch(()=>alert('Erro ao alterar senha'));
    }else if(pw){alert('A senha deve ter pelo menos 6 caracteres')}
}

async function logout(){
    try{await fetch('/crm/auth/logout',{method:'POST'})}catch(e){}
    window.location.href='/login';
}

loadUserInfo();
</script>
</body>
</html>
