<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCOMM - Aceitar Convite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0b0b0c;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:#13161a;border:1px solid #292d30;border-radius:16px;padding:40px;width:420px;max-width:90vw}
        .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
        .logo-icon{width:40px;height:40px;background:#3b9eff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
        .logo-text{font-size:20px;font-weight:600}
        h1{font-size:22px;text-align:center;margin-bottom:8px}
        .subtitle{text-align:center;color:#6e727a;margin-bottom:32px;font-size:14px}
        .form-group{margin-bottom:20px}
        .form-label{display:block;font-size:13px;font-weight:500;color:#a1a4a5;margin-bottom:6px}
        .form-input{width:100%;padding:12px 16px;background:#0b0e14;border:1px solid #292d30;border-radius:12px;color:#fff;font-size:14px;outline:none;transition:border-color .15s}
        .form-input:focus{border-color:#3b9eff}
        .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;background:#3b9eff;color:#fff}
        .btn:hover{background:#5aadff}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .error{color:#ff453a;font-size:13px;margin-top:12px;display:none}
        .success{color:#34c759;font-size:14px;text-align:center;margin-top:16px;display:none}
        .back{display:block;text-align:center;margin-top:20px;color:#6e727a;font-size:13px;text-decoration:none}
        .back:hover{color:#fff}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">B</div>
            <span class="logo-text">BCOMM</span>
        </div>
        <h1>Accept Invitation</h1>
        <p class="subtitle">Crie sua senha para acessar o sistema</p>

        <form id="invite-form" onsubmit="acceptInvite(event)">
            <div class="form-group">
                <label class="form-label">Nome</label>
                <input type="text" class="form-input" id="name" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-input" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Confirmar Senha</label>
                <input type="password" class="form-input" id="password-confirm" placeholder="Repita a senha" required>
            </div>
            <button type="submit" class="btn" id="btn-submit">Criar Conta</button>
        </form>
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        <a href="/login" class="back">← Voltar para o login</a>
    </div>

<script>
const TOKEN='{{TOKEN}}';

async function acceptInvite(e){
    e.preventDefault();
    const name=document.getElementById('name').value.trim();
    const pw=document.getElementById('password').value;
    const pw2=document.getElementById('password-confirm').value;
    const errEl=document.getElementById('error-msg');
    const okEl=document.getElementById('success-msg');

    errEl.style.display='none';okEl.style.display='none';

    if(pw!==pw2){errEl.textContent='As senhas não conferem';errEl.style.display='block';return}
    if(pw.length<6){errEl.textContent='A senha deve ter pelo menos 6 caracteres';errEl.style.display='block';return}

    document.getElementById('btn-submit').disabled=true;
    try{
        const r=await fetch('/crm/auth/accept-invite',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({token:TOKEN,name,password:pw})
        });
        const data=await r.json();
        if(!r.ok)throw new Error(data.detail||'Erro ao aceitar convite');
        okEl.textContent='Conta criada com sucesso! Redirecionando...';
        okEl.style.display='block';
        setTimeout(()=>window.location.href='/login',2000);
    }catch(e){
        errEl.textContent=e.message;errEl.style.display='block';
    }finally{document.getElementById('btn-submit').disabled=false}
}
</script>
</body>
</html>
